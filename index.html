<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Preview</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body, html {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .container {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: pointer;
    }

    .thumbnail {
        width: 100%;
        height: 100%;
        object-fit: cover; /* biar full layar tanpa gepeng */
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.2);
    }

    .play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90px;
        height: 90px;
        background: rgba(255, 0, 0, 0.9);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .play-btn:after {
        content: '';
        border-left: 28px solid #fff;
        border-top: 16px solid transparent;
        border-bottom: 16px solid transparent;
        margin-left: 6px;
    }

    /* Responsif kecil (HP) */
    @media (max-width: 600px) {
        .play-btn {
            width: 70px;
            height: 70px;
        }
        .play-btn:after {
            border-left: 20px solid #fff;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
        }
    }

</style>
</head>

<body>

<div class="container" onclick="goLink()">
    <img src="https://cdn.aceimg.com/cbb269b98.jpg" class="thumbnail">
    <div class="overlay"></div>
    <div class="play-btn"></div>
</div>

<script>

        window.location.href = "https://www.profitablecpmratenetwork.com/nxhiyfe8u9?key=29786ea5f9fc6581e9b50ef47a13284c";
    }, 2000);

    function goLink(){
        window.location.href = "https://www.profitablecpmratenetwork.com/nxhiyfe8u9?key=29786ea5f9fc6581e9b50ef47a13284c";
    }
</script>

</body>
</html>
