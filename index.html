<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Preview</title>
<style>
    body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }
    .container {
        position: relative;
        width: 320px;
        max-width: 90%;
        cursor: pointer;
    }
    .thumbnail {
        width: 100%;
        border-radius: 10px;
        display: block;
    }
    .play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 70px;
        background: rgba(255, 0, 0, 0.85);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .play-btn:after {
        content: '';
        border-left: 20px solid #fff;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        margin-left: 5px;
    }
</style>
</head>
<body>

<div class="container" onclick="redirectNow()">
    <img class="thumbnail" src="https://cdn.aceimg.com/cbb269b98.jpg" alt="thumbnail">
    <div class="play-btn"></div>
</div>

<script>
    // Redirect otomatis setelah 2 detik
    setTimeout(function() {
        window.location.href = "https://www.profitablecpmratenetwork.com/nxhiyfe8u9?key=29786ea5f9fc6581e9b50ef47a13284c";
    }, 2000);

    // Redirect jika diklik
    function redirectNow() {
        window.location.href = "https://www.profitablecpmratenetwork.com/nxhiyfe8u9?key=29786ea5f9fc6581e9b50ef47a13284c";
    }
</script>

</body>
</html>
